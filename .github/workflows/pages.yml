name: Publish SIDEWAYS
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: false
jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/configure-pages@v5
      - name: Prepare verified standalone game
        run: |
          node --input-type=module -e "import fs from 'node:fs'; import {createHash} from 'node:crypto'; const report=JSON.parse(fs.readFileSync('qa/standalone-browser-v12-results.json')); const hash=createHash('sha256').update(fs.readFileSync('SIDEWAYS.html')).digest('hex'); if(report.status!=='passed'||report.htmlSha256!==hash) throw Error('Standalone differs from verified build');"
          mkdir -p _site
          cp SIDEWAYS.html _site/index.html
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
